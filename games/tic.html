<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Helvetica, Arial, sans-serif;
            background-image:url("https://media.gettyimages.com/id/1398147440/video/alphabet-background-blue-and-black-color-animation-moving-on-screen.jpg?s=640x640&k=20&c=gIzOGKXvwHCE96LoaBR9y_kzX-vuHKGUpybqgSLYzdc=");
            background-size: cover;
        }

        .game {
            display: grid;
            gap: 5px;
            background-color: #34495e;
            width: 300px;
            height: 300px;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            margin: 20px 0;
        }

        .game > div {
            background-color: #d5dbe1;
            color:rgb(15, 13, 13);
            font-size: 4em;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        .game > div:hover {
            transform: scale(1.05);
            background-color:  #ced5db;
        }

        .game > div.winner {
            background: #a5ff80;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            0% { background-color: #a5ff80; }
            100% { background-color: #76d07a; }
        }

        .btn {
            border: 3px solid #2c3e50;
            background-color: #34495e;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1abc9c;
        }

        .scoreboard {
            margin-top: 20px;
            color: #34495e;
            font-size: 1.2em;
        }

        #symbol-selection {
            text-align: center;
        }

        #symbol-selection button {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div id="symbol-selection">
        <p>Choose your symbol:</p>
        <button class="btn" onclick="tic_tac_toe.setSymbols('X', 'O')">X</button>
        <button class="btn" onclick="tic_tac_toe.setSymbols('O', 'X')">O</button>
    </div>
    <div class="game"></div>
    <button class="btn" onclick="tic_tac_toe.restart()">Restart</button>
    <div class="scoreboard">
        Player X: <span id="score-x">0</span> | Player O: <span id="score-o">0</span>
    </div>

    <script>
        const tic_tac_toe = {
            board: Array(9).fill(''),
            symbols: { options: [], turn_index: 0 },
            container_element: null,
            gameover: false,
            scores: { X: 0, O: 0 },
            winning_sequences: [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ],

            init(container) {
                this.container_element = container;
                document.getElementById('symbol-selection').style.display = 'block';
            },

            setSymbols(playerSymbol, opponentSymbol) {
                this.symbols.options = [playerSymbol, opponentSymbol];
                document.getElementById('symbol-selection').style.display = 'none';
                this.start();
            },

            start() {
                this.board.fill('');
                this.draw();
                this.gameover = false;
            },

            make_play(position) {
                if (this.gameover || this.board[position] !== '') return false;

                const currentSymbol = this.symbols.options[this.symbols.turn_index];
                this.board[position] = currentSymbol;
                this.draw();

                const winning_index = this.check_winning_sequences(currentSymbol);
                if (winning_index >= 0) {
                    this.stylize_winner_sequence(this.winning_sequences[winning_index]);
                    this.game_over(`${currentSymbol} Wins!`);
                    this.update_score(currentSymbol);
                } else if (!this.board.includes('')) {
                    this.game_over('It\'s a Draw!');
                } else {
                    this.symbols.turn_index = 1 - this.symbols.turn_index;
                }
                return true;
            },

            stylize_winner_sequence(winner_sequence) {
                setTimeout(() => {
                    winner_sequence.forEach(pos => {
                        this.container_element.children[pos].classList.add('winner');
                    });
                }, 300); // Delay for smoother effect
            },

            check_winning_sequences(symbol) {
                return this.winning_sequences.findIndex(seq =>
                    seq.every(pos => this.board[pos] === symbol)
                );
            },

            game_over(message) {
                this.gameover = true;
                setTimeout(() => alert(message), 300);
            },

            restart() {
                this.start();
                Array.from(this.container_element.children).forEach(div =>
                    div.classList.remove('winner')
                );
            },

            update_score(winner) {
                this.scores[winner]++;
                document.getElementById(`score-${winner.toLowerCase()}`).textContent = this.scores[winner];
            },

            draw() {
                this.container_element.innerHTML = this.board
                    .map((symbol, index) =>
                        `<div onclick="tic_tac_toe.make_play(${index})">${symbol || ''}</div>`
                    )
                    .join('');
            },
        };

        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.querySelector('.game');
            tic_tac_toe.init(gameContainer);
        });
        
    </script>
</body>
</html>
